# Runs on every pull request and on pushes to main: the same checks as
# `npm run check` locally. A red cross here means don't merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Library tests
        run: npm test
      - name: API route tests
        run: npm run test:api
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
